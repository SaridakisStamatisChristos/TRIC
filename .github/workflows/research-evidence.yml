name: Research evidence fidelity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  phase31:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    defaults:
      run:
        working-directory: tric_research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify complete archived trials and original gates
        run: |
          python verify_phase31_evidence.py --source-root evidence/phase32/baseline-sources
          python verify_phase31_stability.py
          python verify_phase31_qualification.py
      - name: Reject coordinated evidence corruption
        run: python -m unittest -q test_phase31_evidence
      - name: Rebuild every prototype and check exact answers with UBSan
        run: python verify_phase31_evidence.py --source-root evidence/phase32/baseline-sources --rebuild-checks
      - name: Verify interval directory release and independent allocation evidence
        run: |
          python verify_interval_storage.py --source-root evidence/phase33/baseline-sources
          python -m unittest -q test_interval_storage_evidence
          python verify_interval_storage.py --source-root evidence/phase33/baseline-sources --quick --run /tmp/tric-interval-storage
      - name: Verify construction qualification, failures, and external comparison
        run: |
          python verify_phase33_evidence.py
          python verify_phase33_external.py
          python -m unittest -q test_phase33_evidence
      - name: Rebuild construction prototypes and external oracle adapters
        if: matrix.python-version == '3.13'
        run: python rebuild_phase33_checks.py /tmp/tric-phase33-checks --external
