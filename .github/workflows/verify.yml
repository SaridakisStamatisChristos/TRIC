name: TRIC research tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test Phases I-VII exactness
        working-directory: tric_research
        run: >-
          python -m unittest -q test_tric test_path_monge test_path_sweep
          test_backbone test_backbone_scc test_frontier_dp
          test_adaptive_exact test_frontier_compact
