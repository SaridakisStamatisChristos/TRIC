name: TRIC research tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify all research exactness tests (including SCC fallback and query strata)
        working-directory: tric_research
        run: >-
          python -m unittest -q test_tric test_path_monge test_path_sweep
          test_backbone test_backbone_scc test_frontier_dp
          test_adaptive_exact test_frontier_compact test_ordered_probe
          test_native_benchmark test_oreach_ci test_closure_index
          test_compact_reachability test_stratified_queries test_phase18_amortization
          test_hot_source_cache test_hot_source_external test_cache_indexed test_phase22_lifetime test_phase22_graphs test_phase22_upstream_failure test_phase23_training test_phase23_admission test_oreach_compatible_input
